<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Resource hints for LCP -->
    <link rel="preload" href="/CHLOGO.png" as="image" fetchpriority="high" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="jYKPyx9tEoM6Ux66VrIIRxFAKhWGlr0_UnyGTr5B6kQ" />
    
    <!-- Title/description/OG tags are set per-page by react-helmet-async (SEO.tsx) -->
    <!-- DO NOT add meta description or og tags here — it creates duplicates on all 60+ pages -->
    <title>Cabos Handyman — Professional Handyman Services in Cabo San Lucas</title>
    <meta name="author" content="Cabos Handyman" />
    <meta property="og:type" content="website" />
    <!--
      Static social-preview tags. react-helmet-async injects per-page og: tags at
      runtime, but the Facebook, WhatsApp and LinkedIn crawlers do not execute
      JavaScript, so without these a shared link renders with no image, title or
      description. These are the site-wide fallback every crawler can see.
      og:image must be absolute.
    -->
    <meta property="og:site_name" content="Cabos Handyman" />
    <meta property="og:url" content="https://www.caboshandyman.com/" />
    <meta property="og:title" content="Cabos Handyman — Handyman &amp; Remodeling in Cabo San Lucas" />
    <meta property="og:description" content="Licensed, insured, bilingual handyman and remodeling crew serving Cabo San Lucas and Los Cabos. Photo updates for owners who aren't in Cabo." />
    <meta property="og:image" content="https://www.caboshandyman.com/images/kitchen-before-after-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="778" />
    <meta property="og:image:alt" content="Before and after of a kitchen remodel in Cabo San Lucas by Cabos Handyman" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cabos Handyman — Handyman &amp; Remodeling in Cabo San Lucas" />
    <meta name="twitter:description" content="Licensed, insured, bilingual handyman and remodeling crew serving Cabo San Lucas and Los Cabos." />
    <meta name="twitter:image" content="https://www.caboshandyman.com/images/kitchen-before-after-og.jpg" />
